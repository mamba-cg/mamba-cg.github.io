<article class="product-card">
  <a class="product-image-link" href="{{DETAIL_URL}}" aria-label="Explore {{NAME}} details">
    <img src="{{IMAGE}}" data-fallback="{{FALLBACK}}" alt="{{NAME}} Blender add-on cover" width="1200" height="675" loading="lazy" decoding="async" />
  </a>
  <div class="product-content">
    <span class="product-type">{{TYPE}}</span>
    <h3>{{NAME}}</h3>
    <p>{{DESCRIPTION}}</p>
    <div class="product-tags">{{TAGS}}</div>
    <a class="product-link" href="{{URL}}" {{TARGET_ATTRS}}>{{CTA}}</a>
  </div>
</article>
